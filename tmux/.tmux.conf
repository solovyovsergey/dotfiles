#------------------------------
# ==========================================
# === ОБЩИЕ НАСТРОЙКИ (GENERAL SETTINGS) ===
# ==========================================

set -s escape-time 0          # Убираем задержку после Esc (для Vim/Neovim)
set -g base-index 1           # Индексация окон начинается с 1
setw -g pane-base-index 1     # Индексация панелей начинается с 1
set -g mouse on               # Включаем поддержку мыши
set -s set-clipboard on       # Синхронизация с системным буфером (OSC 52)
set -g history-limit 50000    # Увеличенный лимит истории строк

# ==========================================
# ===   ГОРЯЧИЕ КЛАВИШИ (KEY BINDINGS)   ===
# ==========================================

# Смена префикса на Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Быстрая перезагрузка конфига кнопкой 'r'
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# --- Управление панелями (Panes) ---

# Разделение панелей (| или \ — вертикально, - — горизонтально)
# Новые панели открываются в той же директории
bind \\ split-window -h -c "#{pane_current_path}"
bind |  split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Навигация между панелями в стиле Vim (Prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Изменение размера панелей (Prefix + Shift + HJKL)
# Флаг -r позволяет изменять размер многократно без повтора префикса
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Режим копирования (Copy Mode) ---

setw -g mode-keys vi          # Включаем VI-режим для навигации в истории

# Настройка выделения и копирования (как в Vim)
# Вход в режим: Prefix + [ | Выход: q | Поиск: /
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================================
# ===   ЦВЕТА И ВИЗУАЛ (APPEARANCE)      ===
# ==========================================

# Поддержка цветов и TrueColor
set -g default-terminal "tmux-256color"

# Разрешаем TrueColor (RGB) для xterm-совместимых терминалов
set -as terminal-features ",xterm-256color:RGB"

# --- Статус-бар ---

set -g status-justify centre             # Центрируем список окон
set -g status-style bg=default,fg=white  # Прозрачный фон статус-бара

# Левая часть: Сессия, Окно, Панель
set -g status-left-length 40
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"

# Правая часть: Дата и время
set -g status-right "#[fg=cyan]%d %b %R"

# --- Индикация активности ---

# Активное окно (Зеленая плашка, черный текст)
setw -g window-status-current-style fg=black,bg=green

# Неактивные окна (Синий текст на прозрачном фоне)
setw -g window-status-style fg=brightblue,bg=default
